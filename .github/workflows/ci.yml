name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate

  ui:
    name: UI / ${{ matrix.project }}
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The shared auth-setup project runs on Chromium, so every matrix job
      # needs it in addition to the browser under test.
      - run: npx playwright install --with-deps chromium
      - run: npx playwright install --with-deps ${{ matrix.project }}
      - run: npx playwright test --project=${{ matrix.project }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: html-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-${{ matrix.project }}
          path: allure-results/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: traces-${{ matrix.project }}
          path: test-results/
          retention-days: 7

  api:
    name: API
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright test --project=api

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-api
          path: allure-results/
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-api
          path: test-results/junit.xml
          retention-days: 7

  a11y:
    name: Accessibility
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=a11y

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-a11y
          path: allure-results/
          retention-days: 7

  publish:
    name: Publish Allure report
    needs: [quality, ui, api, a11y]
    if: always() && github.ref == 'refs/heads/main' && needs.quality.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          pattern: allure-*
          merge-multiple: true
          path: allure-results

      - name: Generate combined report
        run: npx allure generate allure-results --clean -o allure-report

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
