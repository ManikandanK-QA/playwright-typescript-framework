version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      playwright:
        patterns:
          - '@playwright/test'
          - 'playwright*'
      test-tooling:
        patterns:
          - 'allure*'
          - '@axe-core/*'
          - '@faker-js/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
